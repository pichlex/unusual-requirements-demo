<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050507">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Экспериментальный набор haptic-компонентов для Safari на iPhone.">
  <title>Haptic Lab — native feel for the web</title>
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/sliders.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/motion.css">
</head>
<body>
  <div id="app"></div>
  <script type="module">
    const files = ['hero.html', 'sliders.html', 'components.html', 'package.html'];
    const fragments = await Promise.all(files.map(async file => {
      const response = await fetch(`./fragments/${file}`);
      if (!response.ok) throw new Error(`Unable to load ${file}`);
      return response.text();
    }));
    document.querySelector('#app').innerHTML = fragments.join('\n');
    await import('./src/app.js');
  </script>
</body>
</html>
