<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050507">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Экспериментальный набор haptic-компонентов для Safari на iPhone.">
  <title>Haptic Lab — native feel for the web</title>
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/sliders.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/motion.css">
  <link rel="stylesheet" href="./styles/platform.css">
  <link rel="stylesheet" href="./styles/xy-pad.css">
</head>
<body>
  <div id="app"></div>
  <script type="module">
    document.documentElement.classList.add('js');

    try {
      const files = ['hero.html', 'sliders.html', 'components.html', 'package.html'];
      const fragments = await Promise.all(files.map(async file => {
        const response = await fetch(`./fragments/${file}`);
        if (!response.ok) throw new Error(`Unable to load ${file}`);
        return response.text();
      }));

      document.querySelector('#app').innerHTML = fragments.join('\n');
      await import('./src/app.js');
      await import('./src/xy-pad-startup-fix.js');
      await import('./src/xy-pad-init.js');
    } catch (error) {
      document.documentElement.classList.remove('js');
      document.querySelectorAll('.reveal').forEach(element => {
        element.classList.add('is-visible');
      });
      console.error(error);

      const app = document.querySelector('#app');
      if (!app.innerHTML.trim()) {
        app.innerHTML = `
          <main style="max-width:760px;margin:120px auto;padding:24px;color:#fff;font-family:system-ui">
            <h1>Haptic Lab</h1>
            <p>Не удалось загрузить интерактивный модуль. Обновите страницу или откройте закреплённую commit-ссылку ещё раз.</p>
          </main>`;
      }
    }
  </script>
</body>
</html>
